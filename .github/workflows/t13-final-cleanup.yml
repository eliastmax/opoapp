name: T13 final cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize Topic 13 audit wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/v4/pilots/topic-13-gap-question-audit.md')
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  'Estado: lote candidato revisado editorialmente. No dado de alta en `questions`, no incluido todavía en `questionMappings`, no importado.',
                  'Estado: lote revisado y posteriormente materializado en producción durante T13-CONTENT.3. El diseño original se conserva aquí como trazabilidad de la auditoría de huecos.'
              )
              s = s.replace(
                  'El lote final revisado se obtiene en `topic-13-coverage-gap-questions-reviewed.ts`. La salida inicial del generador se conserva en `topic-13-coverage-gap-questions.ts` para trazabilidad; cuatro candidatas fueron refinadas en revisión editorial antes de validar el lote final.',
                  'El lote final revisado se obtiene en `topic-13-coverage-gap-questions-reviewed.ts`. La salida inicial del generador se conserva en `topic-13-coverage-gap-questions.ts` para trazabilidad; las revisiones editoriales posteriores quedan preservadas antes de su materialización V2.'
              )
              s = s.replace(
                  '- Cobertura prospectiva si se validan y dan de alta las 45: 34/34 conceptos con al menos 4 preguntas primarias.',
                  '- Cobertura actual tras T13-CONTENT.3: 34/34 conceptos con al menos 4 preguntas primarias reales en producción.'
              )
              s = s.replace(
                  'La validación estructural no sustituye la aprobación editorial de Gobernanza ni da de alta las preguntas en producción.',
                  'Esta validación documenta el gate previo. La materialización productiva posterior y su verificación 144/18/34/144/68 están documentadas en `topic-13-production-materialization.md`.'
              )
              p.write_text(s)
          PY

      - name: Remove temporary Topic 13 transport workflows and handoffs
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/t13-supabase-capability-probe.yml \
            .github/workflows/t13-controlled-v4-import.yml \
            .github/workflows/t13-package-publish.yml \
            .github/workflows/t13-final-cleanup.yml \
            docs/v4/pilots/topic-13-v4-import-package.json \
            docs/v4/pilots/topic-13-production-import-report.json

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Topic 13 production documentation and cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
