name: T13 package handoff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stop when handoff exists
        id: guard
        run: |
          if [ -f docs/v4/pilots/topic-13-v4-import-package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.guard.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Export exact materialized package
        if: steps.guard.outputs.skip == 'false'
        run: |
          bun -e 'import { topic13EstatutoMarcoMaterializedPackage as p } from "./src/lib/v4-pilots/topic-13-estatuto-marco-materialized"; await Bun.write("docs/v4/pilots/topic-13-v4-import-package.json", JSON.stringify(p));'
          test "$(wc -c < docs/v4/pilots/topic-13-v4-import-package.json)" -eq 69325
          test "$(md5sum docs/v4/pilots/topic-13-v4-import-package.json | cut -d' ' -f1)" = "749a3c330fbc37e0bbdfa1d19e3df3be"

      - name: Commit temporary handoff
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v4/pilots/topic-13-v4-import-package.json
          git commit -m "Publish temporary Topic 13 V4 import handoff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
