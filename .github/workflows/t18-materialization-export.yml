name: T18 Materialization Export

on:
  push:
    branches:
      - agent/v4-content-t18-materialize

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export approved Topic 18 payloads
        run: bun scripts/export-t18-materialization.ts

      - name: Upload Topic 18 handoff
        uses: actions/upload-artifact@v4
        with:
          name: t18-materialization-handoff
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
