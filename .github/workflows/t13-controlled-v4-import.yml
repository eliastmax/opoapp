name: T13 controlled V4 import

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-topic-13:
    if: ${{ !contains(github.event.pull_request.head.ref, 'dependabot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stop after import report exists
        id: guard
        run: |
          if [ -f docs/v4/pilots/topic-13-production-import-report.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.guard.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Quality gate on exact import HEAD
        if: steps.guard.outputs.skip == 'false'
        run: bun run check

      - name: Export exact validated Topic 13 package
        if: steps.guard.outputs.skip == 'false'
        run: |
          bun -e 'import { topic13EstatutoMarcoMaterializedPackage as p } from "./src/lib/v4-pilots/topic-13-estatuto-marco-materialized"; await Bun.write("/tmp/t13-v4-package.json", JSON.stringify(p));'

      - name: Controlled V4 RPC import
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.error, urllib.parse, urllib.request

          PROJECT = "kimswvynzehmilqydcgz"
          ADMIN_UID = "968cfd86-49b5-4ac1-9e1e-a0c09ce1bb92"
          OPP = "00000000-0000-4000-8000-000000000001"
          TOPIC = "e386fadf-cdcd-46f5-ae37-6dad7007956a"
          REPORT = pathlib.Path("docs/v4/pilots/topic-13-production-import-report.json")
          package_text = pathlib.Path("/tmp/t13-v4-package.json").read_text()
          package = json.loads(package_text)

          def write_report(payload):
              REPORT.parent.mkdir(parents=True, exist_ok=True)
              REPORT.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")

          if not (
              package.get("version") == "4.0"
              and package.get("oppositionCode") == "auxiliar-administrativo-sms"
              and package.get("topicNumber") == 13
              and len(package.get("units", [])) == 18
              and len(package.get("concepts", [])) == 34
              and len(package.get("questionMappings", [])) == 144
              and len(package.get("flashcards", [])) == 68
          ):
              write_report({"status":"blocked_invalid_export_dimensions"})
              raise SystemExit(2)

          dollar = "$t13pkg$"
          if dollar in package_text:
              write_report({"status":"blocked_dollar_quote_collision"})
              raise SystemExit(2)
          pkg_sql = f"{dollar}{package_text}{dollar}::jsonb"

          counts_sql = f"""
          select jsonb_build_object(
            'active_questions',(select count(*) from public.questions where opposition_id='{OPP}'::uuid and topic_id='{TOPIC}'::uuid and activa),
            'units',(select count(*) from public.study_units where opposition_id='{OPP}'::uuid and topic_id='{TOPIC}'::uuid and active),
            'concepts',(select count(*) from public.concepts where opposition_id='{OPP}'::uuid and topic_id='{TOPIC}'::uuid and active),
            'primary_mappings',(select count(*) from public.question_concepts where opposition_id='{OPP}'::uuid and topic_id='{TOPIC}'::uuid and role='primary'),
            'flashcards',(select count(*) from public.flashcards f join public.concepts c on c.id=f.concept_id where f.opposition_id='{OPP}'::uuid and c.topic_id='{TOPIC}'::uuid and f.active)
          ) as result;
          """

          coverage_sql = f"""
          select jsonb_build_object(
            'concepts_total', count(*),
            'concepts_ready', count(*) filter (where primary_n >= 4),
            'coverage_gap', count(*) filter (where primary_n between 1 and 3),
            'zero_coverage', count(*) filter (where primary_n = 0),
            'min_primary', min(primary_n),
            'max_primary', max(primary_n)
          ) as result
          from (
            select c.id, count(distinct qc.question_id)::int as primary_n
            from public.concepts c
            left join public.question_concepts qc on qc.concept_id=c.id and qc.role='primary'
            where c.opposition_id='{OPP}'::uuid and c.topic_id='{TOPIC}'::uuid and c.active
            group by c.id
          ) s;
          """

          duplicate_sql = f"""
          select jsonb_build_object(
            'duplicate_primary_questions', (select count(*) from (select question_id from public.question_concepts where opposition_id='{OPP}'::uuid and topic_id='{TOPIC}'::uuid and role='primary' group by question_id having count(*)>1) d),
            'new_unmapped', (select count(*) from public.questions q left join public.question_concepts qc on qc.question_id=q.id and qc.role='primary' where q.opposition_id='{OPP}'::uuid and q.topic_id='{TOPIC}'::uuid and q.codigo between 'SMS-T13-0100' and 'SMS-T13-0144' and qc.id is null)
          ) as result;
          """

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          db_url = (os.environ.get("SUPABASE_DB_URL", "") or os.environ.get("DATABASE_URL", "")).strip()
          db_password = os.environ.get("SUPABASE_DB_PASSWORD", "").strip()
          mode = None

          def extract_result(value):
              if isinstance(value, list) and value:
                  row = value[-1]
                  if isinstance(row, dict) and "result" in row:
                      return row["result"]
              if isinstance(value, dict) and "result" in value:
                  return value["result"]
              return value

          def management_sql(sql):
              url = f"https://api.supabase.com/v1/projects/{PROJECT}/database/query"
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=90) as resp:
                  return json.loads(resp.read().decode())

          def psql_sql(sql):
              env = os.environ.copy()
              env["PGOPTIONS"] = f"-c request.jwt.claim.sub={ADMIN_UID}"
              proc = subprocess.run(
                  ["psql", db_url, "-X", "-v", "ON_ERROR_STOP=1", "-A", "-t", "-c", sql],
                  text=True, capture_output=True, env=env, timeout=90,
              )
              if proc.returncode != 0:
                  raise RuntimeError(proc.stderr[-2000:])
              lines = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
              if not lines:
                  return None
              try:
                  return [{"result": json.loads(lines[-1])}]
              except json.JSONDecodeError:
                  return [{"result": lines[-1]}]

          try:
              if token:
                  mode = "management_api"
                  run_sql = management_sql
              else:
                  if not db_url and db_password:
                      enc = urllib.parse.quote(db_password, safe="")
                      db_url = f"postgresql://postgres:{enc}@db.{PROJECT}.supabase.co:5432/postgres?sslmode=require"
                  if not db_url:
                      write_report({"status":"blocked_no_supabase_ci_credentials"})
                      raise SystemExit(0)
                  if subprocess.run(["bash","-lc","command -v psql >/dev/null"], check=False).returncode != 0:
                      subprocess.run(["sudo","apt-get","update","-qq"], check=True)
                      subprocess.run(["sudo","apt-get","install","-y","postgresql-client"], check=True)
                  mode = "postgres_connection"
                  run_sql = psql_sql

              before = extract_result(run_sql(counts_sql))
              if before != {"active_questions":144,"units":0,"concepts":0,"primary_mappings":0,"flashcards":0}:
                  write_report({"status":"blocked_precheck_changed","mode":mode,"before":before})
                  raise SystemExit(3)

              if mode == "management_api":
                  preflight_sql = f"BEGIN; select set_config('request.jwt.claim.sub','{ADMIN_UID}',true); select public.import_v4_study_content({pkg_sql}) as result; ROLLBACK;"
              else:
                  preflight_sql = f"BEGIN; select public.import_v4_study_content({pkg_sql}) as result; ROLLBACK;"
              run_sql(preflight_sql)
              after_preflight = extract_result(run_sql(counts_sql))
              if after_preflight != before:
                  write_report({"status":"blocked_preflight_not_reversible","mode":mode,"before":before,"after_preflight":after_preflight})
                  raise SystemExit(4)

              if mode == "management_api":
                  import_sql = f"select set_config('request.jwt.claim.sub','{ADMIN_UID}',true); select public.import_v4_study_content({pkg_sql}) as result;"
              else:
                  import_sql = f"select public.import_v4_study_content({pkg_sql}) as result;"
              import_response = run_sql(import_sql)
              import_result = extract_result(import_response)
              after = extract_result(run_sql(counts_sql))
              coverage = extract_result(run_sql(coverage_sql))
              integrity = extract_result(run_sql(duplicate_sql))

              expected_after = {"active_questions":144,"units":18,"concepts":34,"primary_mappings":144,"flashcards":68}
              expected_coverage = {"concepts_total":34,"concepts_ready":34,"coverage_gap":0,"zero_coverage":0,"min_primary":4,"max_primary":6}
              expected_integrity = {"duplicate_primary_questions":0,"new_unmapped":0}
              status = "success" if after == expected_after and coverage == expected_coverage and integrity == expected_integrity else "post_import_mismatch"
              write_report({
                  "status": status,
                  "mode": mode,
                  "package": {"units":18,"concepts":34,"questionMappings":144,"flashcards":68},
                  "before": before,
                  "preflight_rolled_back": after_preflight == before,
                  "import_result": import_result,
                  "after": after,
                  "coverage": coverage,
                  "integrity": integrity,
              })
              if status != "success":
                  raise SystemExit(5)
          except SystemExit:
              raise
          except Exception as exc:
              write_report({"status":"blocked_execution_error","mode":mode,"error":str(exc)[:1200]})
              raise
          PY

      - name: Commit sanitized import report
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          if [ ! -f docs/v4/pilots/topic-13-production-import-report.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v4/pilots/topic-13-production-import-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record controlled Topic 13 V4 import result"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
