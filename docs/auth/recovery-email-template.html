<h2>Restablece tu contraseña</h2>
<p>Hemos recibido una solicitud para cambiar la contraseña de tu cuenta de OpoTest.</p>
<p>
  <a href="{{ .SiteURL }}/auth/recovery#token_hash={{ .TokenHash }}&type=recovery">
    Cambiar mi contraseña
  </a>
</p>
<p>Por seguridad, al abrir OpoTest tendrás que confirmar una vez antes de que el enlace se consuma.</p>
<p>Si no has solicitado este cambio, puedes ignorar este correo.</p>
